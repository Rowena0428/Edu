<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習進度</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pure-white': '#FFFFFF',
                        'off-white': '#F8F9FA',
                        'deep-blue': '#0A192F',
                        'slate-gray': '#64748B',
                        'joyful-amber': '#F59E0B',
                        'calm-mint': '#10B981',
                        'soft-red': '#EF4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'PingFang TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { background: #F8F9FA; color: #0A192F; }
        .sayo-border { border: 1px solid #E2E8F0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #E2E8F0; border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #CBD5E1; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <!-- 頂部導航欄 -->
    <header class="bg-pure-white sayo-border border-t-0 border-l-0 border-r-0 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div>
            <p class="text-[10px] tracking-widest text-slate-gray mb-0.5">PROGRESS</p>
            <div class="flex items-center">
                <div class="relative inline-block text-left">
                    <button type="button" id="subject-dropdown-btn" class="inline-flex items-center gap-1.5 text-lg font-semibold text-deep-blue hover:text-slate-gray transition-colors">
                        <span id="current-subject-name">中文科</span>
                        <svg class="w-4 h-4 text-slate-gray transition-transform duration-200" id="subject-dropdown-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="subject-dropdown-menu" class="hidden absolute left-0 mt-2 w-32 rounded-2xl bg-pure-white sayo-border shadow-xl py-2 z-50">
                        <button type="button" onclick="changeSubjectById('chinese')" class="w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors">中文科</button>
                        <button type="button" onclick="changeSubjectById('english')" class="w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors">英文科</button>
                        <button type="button" onclick="changeSubjectById('math')" class="w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors">數學科</button>
                    </div>
                </div>
                <span id="subtitle-separator" class="text-lg font-semibold text-gray-300 mx-2">|</span>
                <h1 id="chapter-subtitle" class="text-lg font-semibold text-deep-blue">十二篇範文</h1>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <span id="progress-text" class="text-xs text-slate-gray flex items-center">學習進度：0%</span>
            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden self-center">
                <div id="progress-bar" class="h-full bg-calm-mint w-[0%] transition-all duration-300"></div>
            </div>
            <a href="aura_workspace.html" class="text-xs px-3 py-2 bg-deep-blue text-white rounded-full tracking-wider hover:bg-slate-800 transition-all inline-block">
                返回工作區
            </a>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-[1440px] mx-auto px-4 md:px-6 py-8 grid grid-cols-1 lg:grid-cols-[240px,1fr,280px] xl:grid-cols-[260px,1fr,320px] gap-6 xl:gap-8 items-start">
        
        <!-- 左欄：章節導覽 -->
        <aside class="space-y-6 sticky top-24 z-10 order-1">
            <div class="bg-pure-white rounded-3xl p-6 sayo-border shadow-sm">
                <h2 class="text-sm font-semibold text-deep-blue mb-4">章節導覽</h2>
                <div id="guide-list" class="space-y-2"></div>
            </div>
            <div class="bg-deep-blue rounded-3xl p-6 text-white shadow-md">
                <p class="text-xs text-blue-200 mb-2">💡 今日小貼士</p>
                <p class="text-sm leading-relaxed">保持專注，每完成一個小單元，記得休息 5 分鐘。</p>
            </div>
        </aside>

        <!-- 中欄：隨堂測驗題目與 AI 按鈕區 -->
        <section class="rounded-3xl flex flex-col z-10 order-3 lg:order-2 space-y-6">
            <div class="bg-pure-white rounded-3xl p-6 md:p-10 sayo-border shadow-sm">
                <div class="mb-8 border-b border-gray-100 pb-6">
                    <span class="inline-block text-[10px] tracking-wider font-semibold text-joyful-amber bg-yellow-50 border border-yellow-100 px-3 py-1 rounded-full mb-3">測驗進行中</span>
                    <h2 class="text-2xl md:text-3xl font-semibold text-deep-blue" id="main-title">內容載入中...</h2>
                    <p class="text-sm text-slate-gray mt-2" id="main-author"></p>
                </div>

                <!-- ✨ 新增：動態文章閱讀區塊 (Passage Component) -->
                <div id="passage-wrapper" class="hidden mb-8 p-6 bg-slate-50 border border-gray-200 rounded-2xl">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                        <h3 class="text-xs font-bold text-slate-gray uppercase tracking-wider">Reading Passage</h3>
                    </div>
                    <div id="passage-content" class="text-sm text-deep-blue leading-relaxed font-normal space-y-3"></div>
                </div>

                <!-- 題目核心區塊 -->
                <div class="space-y-8" id="questions-area">
                    <div id="questions-list" class="space-y-8"></div>
                </div>

                <!-- 提交按鈕區 -->
                <div class="mt-12 pt-8 border-t border-gray-100 flex flex-col items-center justify-center">
                    <p class="text-xs text-slate-gray mb-3">答完整卷了？提交給 AI 進行全方位深度點評</p>
                    <button id="ai-grade-btn" type="button" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-2xl shadow-md transition-all active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span>提交 AI 智能全卷批改</span>
                    </button>
                    <div id="ai-feedback-panel" class="hidden mt-6 w-full rounded-2xl border border-indigo-100 bg-indigo-50/70 p-5 text-sm text-deep-blue shadow-sm"></div>
                </div>
            </div>
        </section>

        <!-- 右欄：答題進度面板 -->
        <aside class="sticky top-24 z-10 order-2 lg:order-3 w-full">
            <div class="bg-pure-white rounded-3xl p-6 md:p-8 sayo-border shadow-sm">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                    <h3 class="text-base font-semibold text-deep-blue">答題進度</h3>
                    <span id="total-questions-count" class="text-xs px-2.5 py-1 bg-off-white rounded-md text-slate-gray font-medium border border-gray-200"></span>
                </div>
                <div id="bulb-container" class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
            </div>
        </aside>
    </main>

    <script>
        let allSubjects = [];
        let currentSubject = null;
        let currentSubjectId = '';
        // API base - change if your backend runs on a different host/port
        const API_BASE = 'http://localhost:3000';
        let currentTotalQuestions = 0;
        let scrollSpyObserver;
        let isManualScrolling = false;
        let answerDebounceTimers = {};
        let savedAnswers = {};

        async function initApp() {
            try {
                const response = await fetch(`${API_BASE}/api/subjects`);
                const data = await response.json();
                allSubjects = data.subjects || [];
                if (!allSubjects.length) {
                    throw new Error('No subjects returned from API');
                }

                renderSubjectMenu(allSubjects);
                await changeSubjectById(allSubjects[0].id);
            } catch (error) {
                console.error(error);
                document.getElementById('main-title').textContent = '資料載入失敗';
                document.getElementById('main-author').textContent = '請確認後端服務已啟動。';
            }
        }

        function renderSubjectMenu(subjects) {
            const menu = document.getElementById('subject-dropdown-menu');
            menu.innerHTML = '';
            subjects.forEach((subject) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors';
                button.textContent = subject.name;
                button.addEventListener('click', () => {
                    changeSubjectById(subject.id);
                });
                menu.appendChild(button);
            });
        }

        async function changeSubjectById(subjectId) {
            const subject = allSubjects.find(item => item.id === subjectId) || allSubjects[0];
            if (!subject) return;

            currentSubjectId = subject.id;
            currentSubject = subject;

            document.getElementById('current-subject-name').textContent = subject.name;
            const subtitleEl = document.getElementById('chapter-subtitle');
            const separator = document.getElementById('subtitle-separator');

            subtitleEl.textContent = subject.subtitle;
            subtitleEl.style.display = 'block';
            separator.style.display = 'inline-block';

            document.getElementById('main-title').textContent = subject.title;
            document.getElementById('main-author').textContent = subject.author;

            const passageWrapper = document.getElementById('passage-wrapper');
            const passageContent = document.getElementById('passage-content');
            if (subject.passage && subject.passage.trim() !== '') {
                passageContent.innerHTML = subject.passage;
                passageWrapper.classList.remove('hidden');
            } else {
                passageWrapper.classList.add('hidden');
                passageContent.innerHTML = '';
            }

            currentTotalQuestions = subject.questions.length;
            document.getElementById('total-questions-count').textContent = `共 ${currentTotalQuestions} 題`;

            await loadProgressForSubject(subject.id);
            renderGuide(subject.chapters);
            renderQuestions(subject.questions, subject.chapters);
            renderBulbs(currentTotalQuestions);
            updateOverallProgress();
            setupScrollSpy();
            closeMenu();
        }

        async function loadProgressForSubject(subjectId) {
            try {
                const response = await fetch(`${API_BASE}/api/progress/${subjectId}`);
                const data = await response.json();
                savedAnswers = data.answers || {};
            } catch (error) {
                console.error(error);
                savedAnswers = {};
            }
        }

        function renderGuide(chapters) {
            const container = document.getElementById('guide-list');
            container.innerHTML = '';
            chapters.forEach((chapter, index) => {
                const num = index + 1;
                const isActive = index === 0;
                container.innerHTML += `
                    <button id="guide-btn-${num}" onclick="scrollToQuestion(${num})" class="chapter-nav-btn w-full flex items-center justify-between px-3 py-2 text-sm rounded-xl transition-colors ${isActive ? 'bg-off-white text-deep-blue font-semibold' : 'text-slate-gray hover:bg-off-white hover:text-deep-blue'}">
                        <span class="truncate pr-2">${chapter}</span>
                        <span id="guide-check-${num}" class="hidden shrink-0 text-calm-mint text-xs bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded-md font-bold">✓</span>
                    </button>
                `;
            });
        }

        function scrollToQuestion(num) {
            const targetBlock = document.getElementById(`q-box-${num}`);
            if (targetBlock) {
                isManualScrolling = true;
                targetBlock.scrollIntoView({ behavior: 'smooth' });
                highlightGuide(num);

                setTimeout(() => {
                    isManualScrolling = false;
                }, 800);
            }
        }

        function highlightGuide(num) {
            const buttons = document.querySelectorAll('.chapter-nav-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-off-white', 'text-deep-blue', 'font-semibold');
                btn.classList.add('text-slate-gray', 'hover:bg-off-white', 'hover:text-deep-blue');
            });
            const activeBtn = document.getElementById(`guide-btn-${num}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-gray', 'hover:bg-off-white', 'hover:text-deep-blue');
                activeBtn.classList.add('bg-off-white', 'text-deep-blue', 'font-semibold');
            }
        }

        function setupScrollSpy() {
            if (scrollSpyObserver) scrollSpyObserver.disconnect();

            const options = {
                root: null,
                rootMargin: '-25% 0px -60% 0px',
                threshold: 0
            };

            scrollSpyObserver = new IntersectionObserver((entries) => {
                if (isManualScrolling) return;

                if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 60) {
                    highlightGuide(currentTotalQuestions);
                    return;
                }

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const num = id.split('-').pop();
                        highlightGuide(parseInt(num));
                    }
                });
            }, options);

            document.querySelectorAll('.question-card-block').forEach(section => {
                scrollSpyObserver.observe(section);
            });
        }

        function renderQuestions(questionsArray, chaptersArray) {
            const container = document.getElementById('questions-list');
            container.innerHTML = '';
            questionsArray.forEach((q, i) => {
                const qNum = i + 1;
                const chapterTag = chaptersArray[i] || '';
                container.insertAdjacentHTML('beforeend', `
                    <div class="question-card-block bg-pure-white rounded-2xl p-6 border border-gray-100 shadow-sm scroll-mt-28 transition-all" id="q-box-${qNum}">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-50">
                            <span class="text-xs font-bold text-indigo-500 uppercase tracking-wider">${chapterTag}</span>
                            <span class="text-xs bg-amber-50 text-joyful-amber font-semibold px-2.5 py-0.5 rounded-md">Q${qNum}</span>
                        </div>
                        <p class="text-base font-medium text-deep-blue mb-4">${q.text}</p>
                        <textarea
                            id="input-${qNum}"
                            data-question-id="${q.id}"
                            onfocus="highlightGuide(${qNum})"
                            oninput="handleInput(${qNum}, this.value, '${q.id}')"
                            class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-joyful-amber outline-none text-sm transition-all resize-none custom-scrollbar"
                            rows="4"
                            placeholder="請在此處輸入您的作答答案..."></textarea>

                        <div class="mt-4 flex justify-end items-center">
                            <button type="button" onclick="toggleTips(${qNum})" class="text-xs px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-deep-blue font-semibold rounded-xl transition-all shadow-sm">
                                答題提示
                            </button>
                        </div>

                        <div id="tips-panel-${qNum}" class="hidden mt-4 p-4 bg-indigo-50/60 border border-indigo-100 rounded-2xl">
                            <p class="text-xs font-bold text-indigo-500 mb-1.5">💡 思路引導 (Tips)：</p>
                            <p class="text-sm text-deep-blue leading-relaxed">${q.tips}</p>
                        </div>
                    </div>
                `);

                const textarea = document.getElementById(`input-${qNum}`);
                if (textarea && savedAnswers[q.id]?.content) {
                    textarea.value = savedAnswers[q.id].content;
                }
            });
        }

        function renderBulbs(count) {
            const container = document.getElementById('bulb-container');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div id="bulb-${i}"
                         class="w-8 h-8 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-slate-gray text-xs font-bold cursor-pointer hover:scale-105 transition-all"
                         onclick="scrollToQuestion(${i})">
                        ${i}
                    </div>`;
            }
        }

        function handleInput(index, value, questionId) {
            const bulb = document.getElementById(`bulb-${index}`);
            const checkTag = document.getElementById(`guide-check-${index}`);

            highlightGuide(index);

            if (value.trim() === '') {
                if (bulb) {
                    bulb.classList.remove('bg-calm-mint', 'text-white', 'border-transparent');
                    bulb.classList.add('bg-gray-100', 'text-slate-gray', 'border-gray-200');
                }
                if (checkTag) {
                    checkTag.classList.add('hidden');
                }
            } else {
                if (bulb) {
                    bulb.classList.remove('bg-gray-100', 'text-slate-gray', 'border-gray-200');
                    bulb.classList.add('bg-calm-mint', 'text-white', 'border-transparent');
                }
                if (checkTag) {
                    checkTag.classList.remove('hidden');
                }
            }

            updateOverallProgress();
            debounceSaveAnswer(questionId, value);
        }

        function debounceSaveAnswer(questionId, content) {
            if (!questionId) return;
            if (answerDebounceTimers[questionId]) {
                clearTimeout(answerDebounceTimers[questionId]);
            }
            answerDebounceTimers[questionId] = setTimeout(() => {
                saveAnswer(questionId, content);
            }, 1000);
        }

        async function saveAnswer(questionId, content) {
            if (!currentSubjectId || !questionId) return;
            try {
                await fetch(`${API_BASE}/api/answers/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ questionId, content, subjectId: currentSubjectId })
                });
            } catch (error) {
                console.error(error);
            }
        }

        function toggleTips(index) {
            const panelEl = document.getElementById('tips-panel-' + index);
            if (panelEl) {
                panelEl.classList.toggle('hidden');
            }
        }

        function updateOverallProgress() {
            if (currentTotalQuestions === 0) return;
            const textareas = document.querySelectorAll('#questions-list textarea');
            let answeredCount = 0;
            textareas.forEach(ta => {
                const isAnswered = ta.value.trim() !== '';
                if (isAnswered) answeredCount++;

                const index = parseInt(ta.id.replace('input-', ''), 10);
                const bulb = document.getElementById(`bulb-${index}`);
                const checkTag = document.getElementById(`guide-check-${index}`);
                if (isAnswered) {
                    bulb?.classList.remove('bg-gray-100', 'text-slate-gray', 'border-gray-200');
                    bulb?.classList.add('bg-calm-mint', 'text-white', 'border-transparent');
                    checkTag?.classList.remove('hidden');
                } else {
                    bulb?.classList.remove('bg-calm-mint', 'text-white', 'border-transparent');
                    bulb?.classList.add('bg-gray-100', 'text-slate-gray', 'border-gray-200');
                    checkTag?.classList.add('hidden');
                }
            });

            const percent = Math.round((answeredCount / currentTotalQuestions) * 100);
            document.getElementById('progress-text').textContent = `學習進度：${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function stripHtml(value) {
            return String(value || '')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<p[^>]*>/gi, '')
                .replace(/<\/p>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/&quot;/gi, '"')
                .replace(/&#39;/gi, "'");
        }

        function buildGradePrompt() {
            if (!currentSubject) return '';

            const questionBlocks = currentSubject.questions.map((question, index) => {
                const textarea = document.getElementById(`input-${index + 1}`);
                const answer = textarea ? textarea.value : '';
                return `---\nQ${index + 1}. ${question.text}\n學生作答：${answer || '（空白）'}\n`;
            }).join('\n');

            const passageText = stripHtml(currentSubject.passage || '').trim();
            return [
                `【當前測驗科目】：${currentSubject.name || '未知科目'}`,
                `【科目副標題】：${currentSubject.subtitle || ''}`,
                `【閱讀文章】：`,
                passageText || '（無閱讀文章）',
                '',
                questionBlocks.trim()
            ].join('\n');
        }

        function renderMarkdownToHtml(markdown) {
            const lines = String(markdown || '').split(/\n/);
            const html = [];
            let inList = false;

            const flushList = () => {
                if (inList) {
                    html.push('</ul>');
                    inList = false;
                }
            };

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) {
                    flushList();
                    html.push('<div class="h-2"></div>');
                    return;
                }

                if (/^###\s+/.test(trimmed)) {
                    flushList();
                    html.push(`<h3 class="mt-4 mb-2 text-base font-semibold text-deep-blue">${escapeHtml(trimmed.replace(/^###\s+/, ''))}</h3>`);
                    return;
                }

                if (/^[-*]\s+/.test(trimmed)) {
                    if (!inList) {
                        html.push('<ul class="ml-5 list-disc space-y-1 text-sm leading-7">');
                        inList = true;
                    }
                    html.push(`<li>${escapeHtml(trimmed.replace(/^[-*]\s+/, ''))}</li>`);
                    return;
                }

                flushList();
                const paragraph = escapeHtml(trimmed)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>');
                html.push(`<p class="text-sm leading-7 text-deep-blue">${paragraph}</p>`);
            });

            flushList();
            return html.join('');
        }

        async function handleGrade() {
            const button = document.getElementById('ai-grade-btn');
            const panel = document.getElementById('ai-feedback-panel');
            if (!button || !panel) return;

            button.disabled = true;
            button.classList.add('opacity-70', 'cursor-not-allowed');
            panel.classList.remove('hidden');
            panel.innerHTML = `
                <div class="flex items-center gap-3 text-sm font-semibold">
                    <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z"></path>
                    </svg>
                    <span>AI 正在批改您的整份作答，請稍候...</span>
                </div>`;

            try {
                const answers = {};
                document.querySelectorAll('#questions-list textarea').forEach((textarea) => {
                    const questionId = textarea.dataset.questionId;
                    if (questionId) {
                        answers[questionId] = textarea.value;
                    }
                });

                // Use process.js (generic AI endpoint) with 'generate' action
                const payload = {
                    action: 'generate',
                    chatRoomId: 'grader',
                    subject: currentSubject?.name || '',
                    subjectId: currentSubjectId,
                    text: buildGradePrompt(),
                    answers
                };

                const response = await fetch(`${API_BASE}/api/process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('AI grading request failed');
                }

                const data = await response.json();
                // process.js returns generated content in `text` field for generate requests
                const report = data.text || data.report || '暫無評語';
                panel.innerHTML = `<div class="space-y-3">${renderMarkdownToHtml(report)}</div>`;
            } catch (error) {
                console.error(error);
                panel.innerHTML = '<div class="text-sm text-soft-red">AI 批改暫時失敗，請稍後再試。</div>';
            } finally {
                button.disabled = false;
                button.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        function closeMenu() {
            document.getElementById('subject-dropdown-menu').classList.add('hidden');
            document.getElementById('subject-dropdown-arrow').style.transform = 'rotate(0deg)';
        }

        window.addEventListener('scroll', () => {
            if (isManualScrolling) return;
            if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 20) {
                highlightGuide(currentTotalQuestions);
            }
        });

        document.getElementById('subject-dropdown-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const menu = document.getElementById('subject-dropdown-menu');
            const arrow = document.getElementById('subject-dropdown-arrow');
            const isHidden = menu.classList.toggle('hidden');
            arrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        document.addEventListener('click', closeMenu);
        document.getElementById('ai-grade-btn').addEventListener('click', handleGrade);

        initApp();
    </script>
</body>
</html>
