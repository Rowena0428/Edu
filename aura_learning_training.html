<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習進度</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pure-white': '#FFFFFF',
                        'off-white': '#F8F9FA',
                        'deep-blue': '#0A192F',
                        'slate-gray': '#64748B',
                        'joyful-amber': '#F59E0B',
                        'calm-mint': '#10B981',
                        'soft-red': '#EF4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'PingFang TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { background: #F8F9FA; color: #0A192F; }
        .sayo-border { border: 1px solid #E2E8F0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #E2E8F0; border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #CBD5E1; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <header class="bg-pure-white sayo-border border-t-0 border-l-0 border-r-0 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div>
            <p class="text-[10px] tracking-widest text-slate-gray mb-0.5">PROGRESS</p>
            <div class="flex items-center">
                <div class="relative inline-block text-left">
                    <button type="button" id="subject-dropdown-btn" class="inline-flex items-center gap-1.5 text-lg font-semibold text-deep-blue hover:text-slate-gray transition-colors">
                        <span id="current-subject-name">中文科</span>
                        <svg class="w-4 h-4 text-slate-gray transition-transform duration-200" id="subject-dropdown-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="subject-dropdown-menu" class="hidden absolute left-0 mt-2 w-32 rounded-2xl bg-pure-white sayo-border shadow-xl py-2 z-50">
                        <button type="button" onclick="changeSubjectById('chinese')" class="w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors">中文科</button>
                    </div>
                </div>
                <span id="subtitle-separator" class="text-lg font-semibold text-gray-300 mx-2">|</span>
                <h1 id="chapter-subtitle" class="text-lg font-semibold text-deep-blue">十二篇範文</h1>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <span id="progress-text" class="text-xs text-slate-gray flex items-center">學習進度：0%</span>
            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden self-center">
                <div id="progress-bar" class="h-full bg-calm-mint w-[0%] transition-all duration-300"></div>
            </div>
            <a href="aura_workspace.html" class="text-xs px-3 py-2 bg-deep-blue text-white rounded-full tracking-wider hover:bg-slate-800 transition-all inline-block">
                返回工作區
            </a>
        </div>
    </header>

    <main class="max-w-[1440px] mx-auto px-4 md:px-6 py-8 grid grid-cols-1 lg:grid-cols-[240px,1fr,280px] xl:grid-cols-[260px,1fr,320px] gap-6 xl:gap-8 items-start">
        
        <aside class="space-y-6 sticky top-24 z-10 order-1">
            <div class="bg-pure-white rounded-3xl p-6 sayo-border shadow-sm">
                <h2 class="text-sm font-semibold text-deep-blue mb-4">章節導覽</h2>
                <div id="guide-list" class="space-y-2 relative"></div>
            </div>
            <div class="bg-deep-blue rounded-3xl p-6 text-white shadow-md">
                <p class="text-xs text-blue-200 mb-2">💡 今日小貼士</p>
                <p class="text-sm leading-relaxed">保持專注，每完成一個小單元，記得休息 5 分鐘。</p>
            </div>
        </aside>

        <section class="rounded-3xl flex flex-col z-10 order-3 lg:order-2 space-y-6">
            <div class="bg-pure-white rounded-3xl p-6 md:p-10 sayo-border shadow-sm">
                <div class="mb-8 border-b border-gray-100 pb-6">
                    <span class="inline-block text-[10px] tracking-wider font-semibold text-joyful-amber bg-yellow-50 border border-yellow-100 px-3 py-1 rounded-full mb-3">測驗進行中</span>
                    <h2 class="text-2xl md:text-3xl font-semibold text-deep-blue" id="main-title">內容載入中...</h2>
                    <p class="text-sm text-soft-red font-medium mt-2" id="main-author"></p>
                </div>

                <div id="passage-wrapper" class="hidden mb-8 p-6 bg-slate-50 border border-gray-200 rounded-2xl">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                        <h3 class="text-xs font-bold text-slate-gray uppercase tracking-wider">Reading Passage</h3>
                    </div>
                    <div id="passage-content" class="text-sm text-deep-blue leading-relaxed font-normal space-y-3"></div>
                </div>

                <div class="space-y-8" id="questions-area">
                    <div id="questions-list" class="space-y-8"></div>
                </div>

                <div class="mt-12 pt-8 border-t border-gray-100 flex flex-col items-center justify-center">
                    <p class="text-xs text-slate-gray mb-3">答完整卷了？提交給 AI 進行全方位深度點評</p>
                    <button id="ai-grade-btn" type="button" class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-2xl shadow-md transition-all active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span>提交 AI 智能全卷批改</span>
                    </button>
                    <div id="ai-feedback-panel" class="hidden mt-6 w-full rounded-2xl border border-indigo-100 bg-indigo-50/70 p-5 text-sm text-deep-blue shadow-sm"></div>
                </div>
            </div>
        </section>

        <aside class="sticky top-24 z-10 order-2 lg:order-3 w-full">
            <div class="bg-pure-white rounded-3xl p-6 md:p-8 sayo-border shadow-sm">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                    <h3 class="text-base font-semibold text-deep-blue">答題進度</h3>
                    <span id="total-questions-count" class="text-xs px-2.5 py-1 bg-off-white rounded-md text-slate-gray font-medium border border-gray-200"></span>
                </div>
                <div id="bulb-container" class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
            </div>
        </aside>
    </main>

    <script>
        let allSubjects = [];
        let currentSubject = null;
        let currentSubjectId = '';
        let currentChapterIndex = 1;
        let currentChinesePage = '《師說》';
        const API_BASE = 'http://localhost:3000';
        let currentTotalQuestions = 0;
        let scrollSpyObserver;
        let isManualScrolling = false;
        let savedAnswers = {};

        const extraTrainingPages = [
            '《師說》',
            '《論仁、論孝、論君子》',
            '《廉頗藺相如列傳》',
            '《岳陽樓記》',
            '《始得西山宴遊記》',
            '《出師表》',
            '《登樓》',
            '《山居秋暝》',
            '《月下獨酌》',
            '《青玉案．元夕》',
            '《聲聲慢．秋情》',
            
            '《念奴嬌．赤壁懷古》'
        ];

        // 測試用的假資料 (Mock Data)
        const mockData = [
            {
                id: 'chinese',
                name: '中文科',
                subtitle: '十二篇範文 (測試模式)',
                title: '閱讀理解測驗',
                author: '後端連線失敗，目前顯示為 UI 測試資料',
                passage: '<p>這是一段用於測試介面的文章段落。如果您看到這段文字，代表您的前端無法成功從 localhost:3000/api/subjects 取得資料。</p>',
                chapters: ["《魚我所欲也》", "《勸學》（節錄）", "《六國論》", "《逍遙遊》"],
                questions: [
                    { id: 'q1', text: '請問《魚我所欲也》的主旨是什麼？', tips: '思考孟子對於義與生的抉擇。' },
                    { id: 'q2', text: '《勸學》中用了哪些比喻？', tips: '木受繩則直...' },
                    { id: 'q3', text: '六國破滅的原因為何？', tips: '弊在賂秦。' },
                    { id: 'q4', text: '《逍遙遊》中的大鵬鳥象徵什麼？', tips: '絕對的自由境界。' }
                ]
            },
            {
                id: 'english',
                name: '英文科',
                subtitle: '閱讀理解',
                title: 'Global Warming & Climate Change',
                author: 'Dept: Environmental Science',
                passage: '<p>Global warming remains one of the most defining challenges of the 21st century. Driven primarily by human activities, the excessive burning of fossil fuels has released unprecedented amounts of greenhouse gases into the atmosphere. These gases act like a greenhouse blanket, trapping thermal radiation and causing global average temperatures to spike significantly.</p><p>The direct consequences of this warming trend are already visible worldwide: melting polar ice caps, rapidly shifting weather patterns, and more frequent occurrences of extreme weather events. Beyond the immediate environmental toll, climate change poses severe socioeconomic threats to coastal economies due to rising sea levels, which put valuable infrastructure and local tourism at critical risk.</p><p>To combat this existential threat, international cooperation is vital. Global frameworks, such as the Paris Agreement, play a pivotal role by legally binding nations to carbon reduction targets, forcing global industries to accelerate their transition toward sustainable, renewable energy alternatives before reaching a point of no return.</p>',
                chapters: ['1. Introduction', '2. Causes of Warming', '3. Environmental Impact', '4. Future Solutions', '5. Socioeconomic Toll', '6. Policy Frameworks'],
                questions: [
                    { id: 'en-1', text: 'What is identified as the primary driver of climate change?', tips: 'Tip: Scan the opening sentences for keywords like "human activities" and specific types of non-renewable energy resources.' },
                    { id: 'en-2', text: 'According to the text, what are the direct consequences of greenhouse gases?', tips: 'Tip: Look closely at what happens when these gases "trap heat" inside the Earth\'s atmosphere and how that impacts daily weather.' },
                    { id: 'en-3', text: 'Explain the meaning of the word "shifts" (or shifting) as used in the paragraph.', tips: 'Tip: Consider contextual synonyms that represent long-term changes, variations, or movements away from standard environmental conditions.' },
                    { id: 'en-4', text: 'Suggest one individual action that can help reduce carbon emissions.', tips: 'Tip: Think about practical everyday habits related to personal transportation, domestic energy consumption, or green lifestyle choices.' },
                    { id: 'en-5', text: 'How do rising sea levels specifically threaten coastal economies according to recent observations?', tips: 'Tip: Think about infrastructure damage, relocation costs, and the loss of tourism or agricultural lands near coastlines.' },
                    { id: 'en-6', text: 'What role do international treaties (like the Paris Agreement) play in regulating global industries?', tips: 'Tip: Focus on how legally binding carbon limits force large corporations to transition to greener alternatives.' }
                ]
            },
            {
                id: 'mathematics',
                name: 'Mathematics',
                subtitle: 'Algebra Practice',
                title: 'Quadratic Equation Solving',
                author: 'Unit: Mathematics',
                passage: '',
                chapters: ['1. Quadratic Basics', '2. Factoring Techniques', '3. Completing the Square', '4. Formula and Discriminant', '5. Root-Coefficient Relationships', '6. Applied Quadratic Problems'],
                questions: [
                    { id: 'math-1', text: 'When the discriminant Δ is less than 0, what can you say about the real roots of the quadratic equation?', tips: 'Hint: If Δ is negative, the square root part in the quadratic formula is not real. Consider whether the equation has real solutions.' },
                    { id: 'math-2', text: 'Solve the quadratic equation: x² - 5x + 6 = 0.', tips: 'Hint: Factor the quadratic expression into two binomials. Look for numbers that multiply to 6 and add to -5.' },
                    { id: 'math-3', text: 'When is factoring a better method than the quadratic formula?', tips: 'Hint: Factoring is usually easier when the coefficients are small integers and the expression factors nicely.' },
                    { id: 'math-4', text: 'If a quadratic equation has a repeated root, what should the discriminant equal?', tips: 'Hint: A repeated root means the plus/minus part of the quadratic formula is zero.' },
                    { id: 'math-5', text: 'For ax² + bx + c = 0 with roots α and β, write Vieta’s formulas linking the roots and coefficients.', tips: 'Hint: α + β = -b/a and αβ = c/a.' },
                    { id: 'math-6', text: 'A rectangle’s length is 3m longer than its width and its area is 40 m². Write the quadratic equation to solve for the width.', tips: 'Hint: Let width = x and length = x + 3, then use area = length × width.' }
                ]
            }
        ];

        async function initApp() {
            try {
                const response = await fetch(`${API_BASE}/api/subjects`);
                if (!response.ok) throw new Error('伺服器回傳 404，找不到資料');
                
                const data = await response.json();
                allSubjects = data.subjects || [];
                if (!allSubjects.length) throw new Error('資料庫為空');
            } catch (error) {
                console.warn("⚠️ 後端連線失敗，自動啟用本地測試資料，以便預覽 UI：", error);
                allSubjects = mockData; // 載入假資料
            }

            renderSubjectMenu(allSubjects);
            await changeSubjectById(allSubjects[0].id);
        }

        function renderSubjectMenu(subjects) {
            const menu = document.getElementById('subject-dropdown-menu');
            menu.innerHTML = '';
            subjects.forEach((subject) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors';
                button.textContent = subject.name;
                button.addEventListener('click', () => {
                    changeSubjectById(subject.id);
                });
                menu.appendChild(button);
            });
        }

        async function changeSubjectById(subjectId) {
            const subject = allSubjects.find(item => item.id === subjectId) || allSubjects[0];
            if (!subject) return;

            currentSubjectId = subject.id;
            currentSubject = subject;

            document.getElementById('current-subject-name').textContent = subject.name;
            const subtitleEl = document.getElementById('chapter-subtitle');
            
            subtitleEl.textContent = subject.subtitle;
            subtitleEl.style.display = 'block';

            document.getElementById('main-title').textContent = subject.title;
            // 如果是假資料，把作者欄位變成紅字提醒
            const authorEl = document.getElementById('main-author');
            authorEl.textContent = subject.author;
            if (subject.author.includes('失敗')) authorEl.classList.add('text-soft-red');

            const passageWrapper = document.getElementById('passage-wrapper');
            const passageContent = document.getElementById('passage-content');
            if (subject.passage) {
                passageContent.innerHTML = subject.passage;
                passageWrapper.classList.remove('hidden');
            }

            currentTotalQuestions = subject.questions.length;
            document.getElementById('total-questions-count').textContent = `共 ${currentTotalQuestions} 題`;
            currentChapterIndex = 1;

            renderGuideSelect(subject.chapters); // 這裡改為渲染下拉選單
            if (subject.id === 'chinese') {
                currentChinesePage = extraTrainingPages[0];
                switchTrainingPage(extraTrainingPages[0]);
            } else {
                renderChapterQuestions(currentChapterIndex);
            }
            renderBulbs(1);
            updateOverallProgress();
            setupScrollSpy();
            closeMenu();
        }

        // 🌟 新增的渲染下拉選單邏輯
        function renderGuideSelect(chapters) {
            const container = document.getElementById('guide-list');
            
            let optionsHtml = '';
            if (currentSubject?.id === 'chinese') {
                optionsHtml = extraTrainingPages.map((pageTitle) => {
                    return `<option value="page:${pageTitle}">${pageTitle}</option>`;
                }).join('');
            } else {
                optionsHtml = chapters.map((chapter) => {
                    return `<option value="chapter:${chapter}">${chapter}</option>`;
                }).join('');
            }

            container.innerHTML = `
                <div class="relative">
                    <select id="chapter-select" onchange="handleChapterSelection(this.value)" class="w-full appearance-none bg-off-white border border-gray-200 text-deep-blue text-sm rounded-xl px-4 py-3 pr-8 focus:outline-none focus:ring-2 focus:ring-calm-mint transition-colors cursor-pointer font-medium">
                        ${optionsHtml}
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-gray">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                </div>
            `;

            const select = document.getElementById('chapter-select');
            if (select && currentSubject) {
                if (currentSubject.id === 'chinese') {
                    const selectedPage = currentChinesePage || extraTrainingPages[0];
                    select.value = `page:${selectedPage}`;
                } else {
                    const currentChapter = currentSubject.chapters[currentChapterIndex - 1];
                    select.value = `chapter:${currentChapter}`;
                }
            }
        }

        function handleChapterSelection(value) {
            if (typeof value !== 'string') return;
            if (value.startsWith('chapter:')) {
                const chapterTitle = value.slice(8);
                const chapterIndex = currentSubject?.chapters?.indexOf(chapterTitle);
                if (chapterIndex >= 0) {
                    currentChapterIndex = chapterIndex + 1;
                    renderChapterQuestions(currentChapterIndex);
                }
                return;
            }
            if (value.startsWith('page:')) {
                const pageTitle = value.slice(5);
                currentChinesePage = pageTitle;
                switchTrainingPage(pageTitle);
            }
        }

        function findSubjectByPageTitle(pageTitle) {
            const normalized = pageTitle.trim().toLowerCase();
            if (!allSubjects?.length) return null;

            const directMatch = allSubjects.find(item => item.name === pageTitle || item.id === pageTitle || item.name.toLowerCase() === normalized || item.id.toLowerCase() === normalized);
            if (directMatch) return directMatch;

            const aliasMap = {
                '中文科': 'chinese',
                'chinese': 'chinese',
                '英文科': 'english',
                '英文': 'english',
                'english': 'english',
                '數學科': 'mathematics',
                '數學': 'mathematics',
                'mathematics': 'mathematics',
                'math': 'mathematics'
            };
            const targetId = aliasMap[normalized];
            if (targetId) {
                return allSubjects.find(item => item.id === targetId || item.name.toLowerCase() === normalized);
            }

            return null;
        }

        function highlightGuide(num) {
            const select = document.getElementById('chapter-select');
            const chapterTitle = currentSubject?.chapters?.[num - 1];
            if (select && chapterTitle) {
                select.value = `chapter:${chapterTitle}`;
            }
        }

        function switchTrainingPage(pageTitle) {
            if (currentSubject?.id === 'chinese') {
                currentChinesePage = pageTitle;
                renderChinesePage(pageTitle);
                return;
            }

            const pageSubjectIndex = currentSubject?.chapters?.indexOf(pageTitle);
            if (pageSubjectIndex !== undefined && pageSubjectIndex >= 0) {
                renderChapterQuestions(pageSubjectIndex + 1);
                return;
            }

            const targetSubject = findSubjectByPageTitle(pageTitle);
            if (targetSubject) {
                changeSubjectById(targetSubject.id);
                return;
            }

            document.getElementById('current-subject-name').textContent = currentSubject?.name || '中文科';
            document.getElementById('chapter-subtitle').textContent = pageTitle;
            document.getElementById('main-title').textContent = pageTitle;
            document.getElementById('main-author').textContent = '請選擇章節以查看內容';
            document.getElementById('passage-wrapper').classList.add('hidden');
            document.getElementById('questions-list').innerHTML = `
                <div class="p-6 rounded-2xl border border-dashed border-gray-300 text-sm text-slate-gray bg-gray-50">
                    目前已切換至 ${pageTitle}。此頁面內容可進一步擴展為對應練習題與學習材料。
                </div>
            `;
            document.getElementById('total-questions-count').textContent = '共 0 題';
            document.getElementById('bulb-container').innerHTML = '';
            document.getElementById('progress-text').textContent = '學習進度：0%';
            document.getElementById('progress-bar').style.width = '0%';
            currentSubjectId = pageTitle;
            currentTotalQuestions = 0;
        }

        function renderChinesePage(pageTitle) {
            const pageIndex = extraTrainingPages.indexOf(pageTitle);
            const chapterTitle = pageTitle;
            document.getElementById('current-subject-name').textContent = currentSubject?.name || '中文科';
            document.getElementById('chapter-subtitle').textContent = pageTitle;
            document.getElementById('main-title').textContent = pageTitle;
            document.getElementById('main-author').textContent = currentSubject?.author || '';
            document.getElementById('passage-wrapper').classList.add('hidden');
            document.getElementById('questions-list').innerHTML = `
                <div class="p-6 rounded-2xl border border-dashed border-gray-300 text-sm text-slate-gray bg-gray-50">
                    目前已切換至 ${pageTitle}。請選擇內容章節以查看對應練習題。
                </div>
            `;
            document.getElementById('total-questions-count').textContent = '共 0 題';
            document.getElementById('bulb-container').innerHTML = '';
            document.getElementById('progress-text').textContent = '學習進度：0%';
            document.getElementById('progress-bar').style.width = '0%';
            currentSubjectId = currentSubject?.id || 'chinese';
            currentTotalQuestions = 0;

            const select = document.getElementById('chapter-select');
            if (select) {
                select.value = `page:${pageTitle}`;
            }
        }

        function renderChapterQuestions(chapterNumber) {
            const chapterTitle = currentSubject?.chapters?.[chapterNumber - 1] || `第 ${chapterNumber} 章`;
            const question = currentSubject?.questions?.[chapterNumber - 1];
            const author = currentSubject?.author || '';

            document.getElementById('current-subject-name').textContent = currentSubject?.name || '文言名篇';
            document.getElementById('chapter-subtitle').textContent = chapterTitle;
            document.getElementById('main-title').textContent = chapterTitle;
            document.getElementById('main-author').textContent = author;

            const passageWrapper = document.getElementById('passage-wrapper');
            const passageContent = document.getElementById('passage-content');
            if (currentSubject?.passage) {
                passageContent.innerHTML = currentSubject.passage;
                passageWrapper.classList.remove('hidden');
            } else {
                passageWrapper.classList.add('hidden');
            }

            const select = document.getElementById('chapter-select');
            if (select && currentSubject) {
                select.value = `chapter:${chapterTitle}`;
            }

            document.getElementById('questions-list').innerHTML = question ? `
                <div class="question-card-block bg-pure-white rounded-2xl p-6 border border-gray-100 shadow-sm scroll-mt-28 transition-all" id="q-box-1">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-50">
                        <span class="question-card-block-title text-xs font-bold text-indigo-500 uppercase tracking-wider">${chapterTitle}</span>
                        <span class="text-xs bg-amber-50 text-joyful-amber font-semibold px-2.5 py-0.5 rounded-md">Q1</span>
                    </div>
                    <p class="question-card-block-text text-base font-medium text-deep-blue mb-4">${question.text}</p>
                    <textarea id="input-1" data-question-id="${question.id}" onfocus="highlightGuide(1)" oninput="handleInput(1, this.value, '${question.id}')" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-joyful-amber outline-none text-sm transition-all resize-none custom-scrollbar">${savedAnswers[question.id]?.content || ''}</textarea>
                </div>
            ` : `
                <div class="p-6 rounded-2xl border border-dashed border-gray-300 text-sm text-slate-gray bg-gray-50">
                    目前已切換至 ${chapterTitle}。此頁面內容可進一步擴展為對應練習題與學習材料。
                </div>
            `;

            currentTotalQuestions = question ? 1 : 0;
            document.getElementById('total-questions-count').textContent = `共 ${currentTotalQuestions} 題`;
            document.getElementById('bulb-container').innerHTML = question ? `<div id="bulb-1" class="w-8 h-8 rounded-full bg-calm-mint border border-transparent flex items-center justify-center text-white text-xs font-bold">1</div>` : '';
            updateOverallProgress();
            setupScrollSpy();
        }

        function setupScrollSpy() {
            if (scrollSpyObserver) scrollSpyObserver.disconnect();
            const options = { root: null, rootMargin: '-25% 0px -60% 0px', threshold: 0 };
            scrollSpyObserver = new IntersectionObserver((entries) => {
                if (isManualScrolling) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const num = entry.target.id.split('-').pop();
                        highlightGuide(parseInt(num));
                    }
                });
            }, options);

            document.querySelectorAll('.question-card-block').forEach(section => {
                scrollSpyObserver.observe(section);
            });
        }

        function renderBulbs(count) {
            const container = document.getElementById('bulb-container');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div id="bulb-${i}"
                         class="w-8 h-8 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-slate-gray text-xs font-bold cursor-pointer hover:scale-105 transition-all"
                         onclick="scrollToQuestion(${i})">
                        ${i}
                    </div>`;
            }
        }

        function handleInput(index, value) {
            const bulb = document.getElementById(`bulb-${index}`);
            highlightGuide(index);
            if (value.trim() === '') {
                bulb?.classList.remove('bg-calm-mint', 'text-white', 'border-transparent');
                bulb?.classList.add('bg-gray-100', 'text-slate-gray', 'border-gray-200');
            } else {
                bulb?.classList.remove('bg-gray-100', 'text-slate-gray', 'border-gray-200');
                bulb?.classList.add('bg-calm-mint', 'text-white', 'border-transparent');
            }
            updateOverallProgress();
        }

        function updateOverallProgress() {
            if (currentTotalQuestions === 0) return;
            const textareas = document.querySelectorAll('#questions-list textarea');
            let answeredCount = 0;
            textareas.forEach(ta => { if (ta.value.trim() !== '') answeredCount++; });
            const percent = Math.round((answeredCount / currentTotalQuestions) * 100);
            document.getElementById('progress-text').textContent = `學習進度：${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function closeMenu() {
            document.getElementById('subject-dropdown-menu').classList.add('hidden');
            document.getElementById('subject-dropdown-arrow').style.transform = 'rotate(0deg)';
        }

        document.getElementById('subject-dropdown-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const menu = document.getElementById('subject-dropdown-menu');
            const arrow = document.getElementById('subject-dropdown-arrow');
            const isHidden = menu.classList.toggle('hidden');
            arrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        document.addEventListener('click', closeMenu);

        // 啟動應用程式
        initApp();
    </script>
</body>
</html>
