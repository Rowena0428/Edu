                author: '',
                passage: '<div class="space-y-4"><h3 class="text-sm font-semibold">原文</h3><p>古之學者必有師。師者，所以傳道、受業、解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也終不解矣。<br><br>生乎吾前，其聞道也，固先乎吾，吾從而師之；生乎吾後，其聞道也，亦先乎吾，吾從而師之。吾師道也，夫庸知其年之先後生於吾乎？是故無貴無賤，無長無少，道之所存，師之所存也。<br><br>嗟乎！師道之不傳也久矣！欲人之無惑也難矣！古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師。是故聖益聖，愚益愚，聖人之所以為聖，愚人之所以為愚，其皆出於此乎！<br><br>愛其子，擇師而教之；於其身也，則恥師焉，惑矣！彼童子之師，授之書而習其句讀者，非吾所謂傳其道、解其惑者也。句讀之不知，惑之不解，或師焉，或不焉，小學而大遺，吾未見其明也。<br><br>巫、醫、樂師、百工之人，不恥相師；士大夫之族，曰師、曰弟子云者，則羣聚而笑之。問之，則曰︰「彼與彼年相若也，道相似也。」位卑則足羞，官盛則近諛。嗚呼！師道之不復，可知矣。巫、醫、樂師、百工之人，君子不齒，今其智乃反不能及，其可怪也歟！<br><br>聖人無常師，孔子師郯子、萇弘、師襄、老聃。郯子之徒，其賢不及孔子。孔子曰︰「三人行，則必有我師。」是故弟子不必不如師，師不必賢於弟子；聞道有先後，術業有專攻，如是而已。李氏子蟠，年十七，好古文，六藝經傳，皆通習之，不拘於時，學於余。余嘉其能行古道，作《師說》以貽之。</p><h3 class="text-sm font-semibold">譯文</h3><p>古代求學的人一定有老師。老師，是（用來）傳授道理、教授學業、解答疑惑的。人不是生下來就什麼都懂的，誰能沒有疑惑？有了疑惑卻不向老師學習，那些疑惑就終究無法解決。<br><br>出生在我前面的人，他聞道（領悟道理）的時間本來就比我早，我跟從他並以他為師；出生在我後面的人，如果他聞道的時間也比我早，我也跟從他並以他為師。我學習的是「道」，哪裡需要管他的年齡比我大還是比我小呢？因此，無論地位高貴或卑賤，無論年紀大或小，道理存在的地方，就是老師存在的地方。<br><br>唉！從師學習的風氣不流傳已經很久了！想要人們沒有疑惑是很難的！古代的聖人，他們的才智遠遠超過一般人，尚且向老師請教；現在的一般人，他們的才智遠遠不如聖人，卻以向老師學習為恥。所以，聖人更加聖明，愚人更加愚昧。聖人之所以成為聖人，愚人之所以成為愚人，大概都是出於這個原因吧！<br><br>（人們）疼愛自己的孩子，選擇老師來教育他；但對待自己（的學習）時，卻以向老師學習為恥，真是糊塗啊！那些兒童的老師，傳授書本內容，教導他們斷句讀的人，並不是我所說的能傳授道理、解答疑惑的老師。不懂得斷句讀，疑惑又不能解決，有的（小問題）向老師請教，有的（大問題）卻不向老師請教，（這就叫做）小的方面學習了，卻遺漏了大的方面，我沒看出他們哪裡明智。<br><br>巫醫、樂師、工匠這些人，不以互相學習為恥；士大夫那一類人，聽到「老師」、「學生」的稱呼，就聚在一起譏笑。問他們為什麼，就說：「那個人跟那個人年紀差不多，道理也差不多。」（跟地位低的人學習）地位卑微就感到羞恥，（跟地位高的人學習）官位顯赫就覺得是諂媚。唉！從師學習的風氣不能恢復，是可以預見的了！巫醫、樂師、工匠這些人，是君子們所不屑一顧的，現在士大夫的智慧竟然反而比不上他們，這難道不是很可怪的事嗎！<br><br>聖人沒有固定的老師。孔子曾經向郯子、萇弘、師襄、老聃請教。郯子這些人，他們的賢能比不上孔子。孔子說：「三個人走在一起，裡面一定有可以當我老師的人。」所以，學生不一定不如老師，老師也不一定比學生賢能；聞道有先後，術業有專攻，就是這樣罷了。<br><br>李家的孩子蟠，年十七歲，喜好古文，六經的經文與傳注，都認真學習，不被世俗的風氣所限制，向我學習。我讚賞他能實行古人從師學習的道理，所以寫這篇《師說》來送給他。</p></div>',

                    '《廉頗藺相如列傳》': '<div class="space-y-4"><h3 class="text-sm font-semibold">原文</h3><p>廉頗者，趙之良將也。趙惠文王十六年，廉頗為趙將伐齊，大破之，取陽晉，拜為上卿，以勇氣聞於諸侯。藺相如者，趙人也，為趙宦者令繆賢舍人。趙惠文王時，得楚和氏璧。秦昭王聞之，使人遺趙王書，願以十五城請易璧。趙王與大將軍廉頗諸大臣謀：欲予秦，秦城恐不可得，徒見欺；欲勿予，即患秦兵之來。計未定，求人可使報秦者，未得。宦者令繆賢曰：「臣舍人藺相如可使。」王問：「何以知之？」對曰：「臣嘗有罪，竊計欲亡走燕，臣舍人相如止臣，曰：『君何以知燕王？』臣語曰：『臣嘗從大王與燕王會境上，燕王私握臣手，曰：「願結友。」以此知之，故欲往。』相如謂臣曰：『夫趙彊而燕弱，而君幸於趙王，故燕王欲結於君。今君乃亡趙走燕，燕畏趙，其勢必不敢留君，而束君歸趙矣。君不如肉袒伏斧質請罪，則幸得脫矣。』臣從其計，大王亦幸赦臣。臣竊以為其人勇士，有智謀，宜可使。」於是王召見，問藺相如曰：「秦王以十五城請易寡人之璧，可予不？」相如曰：「秦彊而趙弱，不可不許。」王曰：「取吾璧，不予我城，奈何？」相如曰：「秦以城求璧而趙不許，曲在趙；趙予璧而秦不予趙城，曲在秦。均之二策，寧許以負秦曲。」王曰：「誰可使者？」相如曰：「王必無人，臣願奉璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。」趙王於是遂遣相如奉璧西入秦。<br><br>秦王坐章臺見相如，相如奉璧奏秦王。秦王大喜，傳以示美人及左右，左右皆呼萬歲。相如視秦王無意償趙城，乃前曰：「璧有瑕，請指示王。」王授璧，相如因持璧卻立，倚柱，怒髮上衝冠，謂秦王曰：「大王欲得璧，使人發書至趙王，趙王悉召羣臣議，皆曰：『秦貪，負其彊，以空言求璧，償城恐不可得。』議不欲予秦璧。臣以為布衣之交尚不相欺，況大國乎！且以一璧之故逆彊秦之驩，不可。於是趙王乃齋戒五日，使臣奉璧，拜送書於庭。何者？嚴大國之威以修敬也。今臣至，大王見臣列觀，禮節甚倨；得璧，傳之美人，以戲弄臣。臣觀大王無意償趙王城邑，故臣復取璧。大王必欲急臣，臣頭今與璧俱碎於柱矣！」<br><br>相如持其璧睨柱，欲以擊柱。秦王恐其破璧，乃辭謝固請，召有司案圖，指從此以往十五都予趙。相如度秦王特以詐佯為予趙城，實不可得，乃謂秦王曰：「和氏璧，天下所共傳寶也。趙王恐，不敢不獻。趙王送璧時，齋戒五日，今大王亦宜齋戒五日，設九賓於廷，臣乃敢上璧。」秦王度之，終不可彊奪，遂許齋五日，舍相如廣成傳。相如度秦王雖齋，決負約不償城，乃使其從者衣褐，懷其璧，從徑道亡，歸璧於趙。<br><br>秦王齋五日後，乃設九賓禮於廷，引趙使者藺相如。相如至，謂秦王曰：「秦自繆公以來二十餘君，未嘗有堅明約束者也。臣誠恐見欺於王而負趙，故令人持璧歸，間至趙矣。且秦彊而趙弱，大王遣一介之使至趙，趙立奉璧來；今以秦之彊而先割十五都予趙，趙豈敢留璧而得罪於大王乎？臣知欺大王之罪當誅，臣請就湯鑊。唯大王與羣臣孰計議之！」秦王與羣臣相視而嘻。左右或欲引相如去，秦王因曰：「今殺相如，終不能得璧也，而絕秦趙之驩，不如因而厚遇之，使歸趙，趙王豈以一璧之故欺秦邪！」卒廷見相如，畢禮而歸之。相如既歸，趙王以為賢大夫，使不辱於諸侯，拜相如為上大夫。秦亦不以城予趙，趙亦終不予秦璧。<br><br>其後秦伐趙，拔石城。明年，復攻趙，殺二萬人。秦王使使者告趙王，欲與王為好會於西河外澠池。趙王畏秦，欲毋行。廉頗、藺相如計曰：「王不行，示趙弱且怯也。」趙王遂行，相如從。廉頗送至境，與王訣曰：「王行，度道里會遇之禮畢，還，不過三十日。三十日不還，則請立太子為王，以絕秦望。」王許之，遂與秦王會澠池。秦王飲酒酣，曰：「寡人竊聞趙王好音，請奏瑟。」趙王鼓瑟。秦御史前書曰：「某年月日，秦王與趙王會飲，令趙王鼓瑟。」藺相如前曰：「趙王竊聞秦王善為秦聲，請奏盆缻秦王，以相娛樂。」秦王怒，不許。於是相如前進缻，因跪請秦王。秦王不肯擊缻。相如曰：「五步之內，相如請得以頸血濺大王矣！」左右欲刃相如，相如張目叱之，左右皆靡。於是秦王不懌，為一擊缻。相如顧召趙御史書曰：「某年月日，秦王為趙王擊缻。」秦之羣臣曰：「請以趙十五城為秦王壽。」藺相如亦曰：「請以秦之咸陽為趙王壽。」秦王竟酒，終不能加勝於趙。趙亦盛設兵以待秦，秦不敢動。<br><br>既罷歸國，以相如功大，拜為上卿，位在廉頗之右。廉頗曰：「我為趙將，有攻城野戰之大功，而藺相如徒以口舌為勞，而位居我上，且相如素賤人，吾羞，不忍為之下。」宣言曰：「我見相如，必辱之。」相如聞，不肯與會。相如每朝時，常稱病，不欲與廉頗爭列。已而相如出，望見廉頗，相如引車避匿。於是舍人相與諫曰：「臣所以去親戚而事君者，徒慕君之高義也。今君與廉頗同列，廉君宣惡言而君畏匿之，恐懼殊甚，且庸人尚羞之，況於將相乎！臣等不肖，請辭去。」藺相如固止之，曰：「公之視廉將軍孰與秦王？」曰：「不若也。」相如曰：「夫以秦王之威，而相如廷叱之，辱其羣臣，相如雖駑，獨畏廉將軍哉？顧吾念之，彊秦之所以不敢加兵於趙者，徒以吾兩人在也。今兩虎共鬥，其勢不俱生。吾所以為此者，以先國家之急而後私讎也。」廉頗聞之，肉袒負荊，因賓客至藺相如門謝罪。曰：「鄙賤之人，不知將軍寬之至此也。」卒相與驩，為刎頸之交。</p></div><h3 class="text-sm font-semibold">譯文</h3><p>廉頗是趙國的名將。趙惠文王十六年，廉頗攻伐齊國，獲得大勝，被拜為上卿，並以勇氣聞名於諸侯。藺相如是趙國的士人，任職宦者令。當時趙國得到了楚國的和氏璧，秦昭王聞訊後，派人致書請以十五座城交換和氏璧。趙王與群臣商議：「要是把璧送給秦，恐怕秦不履行求城之約；若不送，恐怕秦兵來犯。」一時無計可施。宦者令繆賢推薦藺相如作為使者。藺相如報秦王：趙國弱於秦，無法不允許。秦王要求趙王送璧，卻不肯如約讓城。於是藺相如說出自己願意冒險奉璧赴秦，堅持若秦不守信，必將璧完璧歸趙。秦王接見他後見其不服，藺相如借口璧有瑕疵要求秦王檢查，趁機逼問秦王是否肯償城。秦王怕弄壞璧，先允許齋戒五日、設九賓之禮，但仍不打算真正讓城。結果藺相如以機智奪璧而歸趙，保住了國寶。後來秦趙在澠池會盟，秦王酒醉之際試圖貶低趙王，藺相如挺身而出，憑藉機智和知書達禮維護了國家尊嚴。趙王回國後，因藺相如功勞很大，任命他為上大夫，地位高於廉頗。廉頗不滿，誓言羞辱他；藺相如為避免內耗，多次稱病不出和他見面。藺相如的忍讓和大義最終保全了趙國安定，成為忠勇兼備的名臣。</p></div>',
                    '《論仁、論孝、論君子》': '<div class="space-y-4"><h3 class="text-sm font-semibold">原文</h3><p>【論仁】<br><br>1.子曰：「不仁者，不可以久處約，不可以長處樂。仁者安仁，知者利仁。」(《里仁》第四)<br><br>2.子曰：「富與貴，是人之所欲也；不以其道得之，不處也。貧與賤，是人之所惡也；不以其道得之，不去也。君子去仁，惡乎成名？君子無終食之間違仁，造次必於是，顛沛必於是。」(《里仁》第四)<br><br>3.顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？」 顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」 顏淵曰：「回雖不敏，請事斯語矣。」（《顏淵》第十二）<br><br>4.子曰：「志士仁人，無求生以害仁，有殺身以成仁。」《（衞靈公》第十五）<br><br>【論孝】<br><br>1.孟懿子問孝。子曰：「無違。」 樊遲御，子告之曰：「孟孫問孝於我，我對曰，無違。」 樊遲曰：「何謂也？」子曰：「生，事之以禮；死，葬之以禮，祭之以禮。（《為政》第二）<br><br>2.子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎！」（《為政》第二）<br><br>3.子曰：「事父母幾諫，見志不從，又敬不違，勞而不怨。」（《里仁》第四）<br><br>4.子曰：「父母之年，不可不知也。一則以喜，一則以懼。」（《里仁》第四）<br><br>【論君子】<br><br>1.子曰：「君子不重則不威；學則不固。主忠信。無友不如己者。過則勿憚改。」（《學而》第一）<br><br>2.子曰：「君子坦蕩蕩，小人長戚戚。」（《述而》第七）<br><br>3.司馬牛問君子。子曰：「君子不憂不懼。」 曰：「不憂不懼，斯謂之君子已乎？」子曰：「內省不疚，夫何憂何懼？」（《顏淵》第十二）<br><br>4.子曰：「君子成人之美，不成人之惡。小人反是。」 （《顏淵》第十二）<br><br>5.子曰：「君子恥其言而過其行。」（《憲問》第十四）<br><br>6.子曰：「君子義以為質，禮以行之，孫以出之，信以成之。君子哉！」（《衞靈公》第十五）<br><br>7.子曰：「君子病無能焉，不病人之不己知也。」（《衞靈公》第十五）<br><br>8.子曰：「君子求諸己，小人求諸人。」（《衞靈公》第十五）<br><br>譯文：<br><br>【論仁】<br><br>1.孔子說：「沒有仁德的人，無法長久處於貧困之中，也無法長久處於安樂之中。有仁德的人安於行仁，明智的人知道行仁對自己有利，所以去實行。」<br><br>2.孔子說：「富貴是人人都想要的，但如果不是用正當手段得到的，君子不接受；貧賤是人人都厭惡的，但如果不是因為正當原因造成的，君子也不會以不正當的手段擺脫。君子如果離開了仁德，怎麼能稱得上是君子呢？君子即使在吃一頓飯那麼短的時間裡，也不會背離仁德，即便是在匆忙急迫的時候，也一定堅守仁德，即使在顛沛流離的時候，也同樣堅守仁德。」<br><br>3.顏淵問怎樣才是仁。孔子說：「克制自己，使言行合乎禮，就是仁。一旦做到了克己復禮，天下人自然都會歸向仁。行仁這件事全靠自己，難道還要靠別人嗎？」 顏淵說：「請問實行仁的具體條目。」孔子說：「不合乎禮的事不看，不合乎禮的話不聽，不合乎禮的話不說，不合乎禮的事不做。」 顏淵說：「我雖然愚鈍，請讓我按照您這些話去做。」<br><br>4.孔子說：「志士仁人，不會為了貪生怕死而損害仁德，反而會為了成就仁德，而不惜犧牲自己的生命。」<br><br>【論孝】<br><br>1.孟懿子問什麼是孝。孔子說：「不要違背禮。」後來樊遲替孔子駕車時，孔子告訴他：「孟孫問我孝，我回答他說『不要違背禮』。」樊遲問：「這是什麼意思？」孔子說：「父母活著的時候，依禮侍奉他們；父母去世後，依禮埋葬他們、祭祀他們。」<br><br>2.子游問孝。孔子說：「現在所謂的孝，是指能夠奉養父母。但連狗馬都能夠得到飼養；如果對父母缺乏尊敬，那奉養父母和飼養狗馬有什麼分別呢？」<br><br>3.孔子說：「侍奉父母，如果發現他們有不對的地方，要委婉地勸阻。如果父母心意已決，不聽從自己的勸告，仍舊要對他們保持恭敬，不要違背孝道，雖然內心憂慮，也不要抱怨。」<br><br>4.孔子說：「父母的年紀，不能不記在心裡。一方面因為他們高壽而感到高興，另一方面又因為他們年事已高而感到擔憂。」<br><br>【論君子】<br><br>1.孔子說：「君子如果不莊重，就沒有威嚴；學習（知識）就不會穩固。為人要忠信。不要結交不如自己（指道德修養）的人。有了過錯，就不要怕改正。」<br><br>2.孔子說：「君子心胸寬廣，坦然自若；小人卻經常憂愁恐懼。」<br><br>3.司馬牛問什麼是君子。孔子說：「君子不憂慮，不恐懼。」司馬牛問：「只要不憂不懼，就能算是君子了嗎？」孔子說：「內心反省沒有任何愧疚，有什麼可憂慮、可恐懼的呢？」<br><br>4.孔子說：「君子成全別人的好事，而不助長別人的壞事。小人則剛好相反。」<br><br>5.孔子說：「君子以說出大話而沒有做到為恥。」<br><br>6.孔子說：「君子以義作為做事的根本，用禮節來推行，用謙遜的態度表達出來，用誠信來使其圓滿成功。這才是真正的君子啊！」<br><br>7.孔子說：「君子只擔心自己沒有才能，不擔心別人不了解自己。」<br><br>8.孔子說：「君子要求自己，小人要求別人。」</p></div>'

                delete chineseSubj.pagePassages['《廉頗藺相如列傳》'];

            // ignore

        async function initApp() {
            try {
                const response = await fetch(`${API_BASE}/api/subjects`);
                if (!response.ok) throw new Error('伺服器回傳 404，找不到資料');
                
                const data = await response.json();
                allSubjects = data.subjects || [];
                if (!allSubjects.length) throw new Error('資料庫為空');
            } catch (error) {
                console.warn("⚠️ 後端連線失敗，自動啟用本地測試資料，以便預覽 UI：", error);
                allSubjects = mockData; // 載入假資料
            }

            renderSubjectMenu(allSubjects);
            await changeSubjectById(allSubjects[0].id);
        }

        function renderSubjectMenu(subjects) {
            const menu = document.getElementById('subject-dropdown-menu');
            menu.innerHTML = '';
            subjects.forEach((subject) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'w-full text-left block px-4 py-2.5 text-sm font-medium text-slate-gray hover:bg-off-white hover:text-deep-blue transition-colors';
                button.textContent = subject.name;
                button.addEventListener('click', () => {
                    changeSubjectById(subject.id);
                });
                menu.appendChild(button);
            });
        }

        async function changeSubjectById(subjectId) {
            const subject = allSubjects.find(item => item.id === subjectId) || allSubjects[0];
            if (!subject) return;

            currentSubjectId = subject.id;
            currentSubject = subject;

            document.getElementById('current-subject-name').textContent = subject.name;
            const subtitleEl = document.getElementById('chapter-subtitle');
            
            subtitleEl.textContent = subject.subtitle;
            subtitleEl.style.display = 'block';

            document.getElementById('main-title').textContent = subject.title;
            const authorEl = document.getElementById('main-author');
            if (subject.author && subject.author.trim()) {
                authorEl.textContent = subject.author;
                authorEl.classList.remove('hidden');
                authorEl.classList.toggle('text-soft-red', subject.author.includes('失敗'));
            } else {
                authorEl.textContent = '';
                authorEl.classList.add('hidden');
                authorEl.classList.remove('text-soft-red');
            }

            const passageWrapper = document.getElementById('passage-wrapper');
            const passageContent = document.getElementById('passage-content');
            if (subject.passage) {
                passageContent.innerHTML = subject.passage;
                passageWrapper.classList.remove('hidden');
            }

            currentTotalQuestions = subject.questions.length;
            document.getElementById('total-questions-count').textContent = `共 ${currentTotalQuestions} 題`;
            currentChapterIndex = 1;

            renderGuideSelect(subject.chapters); // 這裡改為渲染下拉選單
            if (subject.id === 'chinese') {
                currentChinesePage = extraTrainingPages.includes(currentChinesePage) ? currentChinesePage : extraTrainingPages[0];
                switchTrainingPage(currentChinesePage);
            } else {
                renderChapterQuestions(currentChapterIndex);
            }
            closeMenu();
        }

        // 🌟 新增的渲染下拉選單邏輯
        function renderGuideSelect(chapters) {
            const container = document.getElementById('guide-list');
            
            let optionsHtml = '';
            if (currentSubject?.id === 'chinese') {
                optionsHtml = extraTrainingPages.map((pageTitle) => {
                    return `<option value="page:${pageTitle}">${pageTitle}</option>`;
                }).join('');
            } else {
                optionsHtml = chapters.map((chapter) => {
                    return `<option value="chapter:${chapter}">${chapter}</option>`;
                }).join('');
            }

            container.innerHTML = `
                <div class="relative">
                    <select id="chapter-select" onchange="handleChapterSelection(this.value)" class="w-full appearance-none bg-off-white border border-gray-200 text-deep-blue text-sm rounded-xl px-4 py-3 pr-8 focus:outline-none focus:ring-2 focus:ring-calm-mint transition-colors cursor-pointer font-medium">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                </div>
            `;

            syncChapterSelect();
        }

        function syncChapterSelect() {
            const select = document.getElementById('chapter-select');
            if (!select || !currentSubject) return;

            let expectedValue;
            if (currentSubject.id === 'chinese') {
                const selectedPage = extraTrainingPages.includes(currentChinesePage) ? currentChinesePage : extraTrainingPages[0];
                currentChinesePage = selectedPage;
                expectedValue = `page:${selectedPage}`;
            } else {
                const currentChapter = currentSubject.chapters?.[currentChapterIndex - 1] || currentSubject.chapters?.[0] || '';
                expectedValue = `chapter:${currentChapter}`;
            }

            select.value = expectedValue;
            Array.from(select.options).forEach((option) => {
                option.selected = option.value === expectedValue;
            });
        }

        function handleChapterSelection(value) {
            if (typeof value !== 'string') return;
            if (value.startsWith('chapter:')) {
                const chapterTitle = value.slice(8);
                const chapterIndex = currentSubject?.chapters?.indexOf(chapterTitle);
                if (chapterIndex >= 0) {
                    currentChapterIndex = chapterIndex + 1;
                    renderChapterQuestions(currentChapterIndex);
                }
                return;
            }
            if (value.startsWith('page:')) {
                const pageTitle = value.slice(5);
                currentChinesePage = pageTitle;
                switchTrainingPage(pageTitle);
                syncChapterSelect();
            }
        }

        function findSubjectByPageTitle(pageTitle) {
            const normalized = pageTitle.trim().toLowerCase();
            if (!allSubjects?.length) return null;

            const directMatch = allSubjects.find(item => item.name === pageTitle || item.id === pageTitle || item.name.toLowerCase() === normalized || item.id.toLowerCase() === normalized);
            if (directMatch) return directMatch;

            const aliasMap = {
                '中文科': 'chinese',
                'chinese': 'chinese',
                '英文科': 'english',
                '英文': 'english',
                'english': 'english',
                '數學科': 'mathematics',
                '數學': 'mathematics',
                'mathematics': 'mathematics',
                'math': 'mathematics'
            };
            const targetId = aliasMap[normalized];
            if (targetId) {
                return allSubjects.find(item => item.id === targetId || item.name.toLowerCase() === normalized);
            }

            return null;
        }

        function highlightGuide(num) {
            if (currentSubject?.id === 'chinese') {
                syncChapterSelect();
            } else {
                const select = document.getElementById('chapter-select');
                const chapterTitle = currentSubject?.chapters?.[num - 1];
                if (select && chapterTitle) {
                    select.value = `chapter:${chapterTitle}`;
                    Array.from(select.options).forEach((option) => {
                        option.selected = option.value === select.value;
                    });
                }
            }

            document.querySelectorAll('#bulb-container [id^="bulb-"]').forEach((bulb) => {
                bulb.classList.remove('ring-2', 'ring-indigo-500', 'scale-110');
            });
            const activeBulb = document.getElementById(`bulb-${num}`);
            if (activeBulb) {
                activeBulb.classList.add('ring-2', 'ring-indigo-500', 'scale-110');
            }
        }

        function switchTrainingPage(pageTitle) {
            if (currentSubject?.id === 'chinese') {
                currentChinesePage = pageTitle;
                renderChinesePage(pageTitle);
                return;
            }

            const pageSubjectIndex = currentSubject?.chapters?.indexOf(pageTitle);
            if (pageSubjectIndex !== undefined && pageSubjectIndex >= 0) {
                renderChapterQuestions(pageSubjectIndex + 1);
                return;
            }

            const targetSubject = findSubjectByPageTitle(pageTitle);
            if (targetSubject) {
                changeSubjectById(targetSubject.id);
                return;
            }

            document.getElementById('current-subject-name').textContent = currentSubject?.name || '中文科';

廉頗者，趙之良將也。趙惠文王十六年，廉頗為趙將伐齊，大破之，取陽晉，拜為上卿，以勇氣聞於諸侯。藺相如者，趙人也，為趙宦者令繆賢舍人。

趙惠文王時，得楚和氏璧。秦昭王聞之，使人遺趙王書，願以十五城請易璧。趙王與大將軍廉頗諸大臣謀：欲予秦，秦城恐不可得，徒見欺；欲勿予，即患秦兵之來。計未定，求人可使報秦者，未得。宦者令繆賢曰：「臣舍人藺相如可使。」王問：「何以知之？」對曰：「臣嘗有罪，竊計欲亡走燕，臣舍人相如止臣，曰：『君何以知燕王？』臣語曰：『臣嘗從大王與燕王會境上，燕王私握臣手，曰「願結友。」以此知之，故欲往。』相如謂臣曰：『夫趙彊而燕弱，而君幸於趙王，故燕王欲結於君。今君乃亡趙走燕，燕畏趙，其勢必不敢留君，而束君歸趙矣。君不如肉袒伏斧質請罪，則幸得脫矣。』臣從其計，大王亦幸赦臣。臣竊以為其人勇士，有智謀，宜可使。」於是王召見，問藺相如曰：「秦王以十五城請易寡人之璧，可予不？」相如曰：「秦彊而趙弱，不可不許。」王曰：「取吾璧，不予我城，奈何？」相如曰：「秦以城求璧而趙不許，曲在趙；趙予璧而秦不予趙城，曲在秦。均之二策，寧許以負秦曲。」王曰：「誰可使者？」相如曰：「王必無人，臣願奉璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。」趙王於是遂遣相如奉璧西入秦。

秦王坐章台見相如，相如奉璧奏秦王。秦王大喜，傳以示美人及左右，左右皆呼萬歲。相如視秦王無意償趙城，乃前曰：「璧有瑕，請指示王。」王授璧，相如因持璧，卻立，倚柱，怒髮上衝冠，謂秦王曰：「大王欲得璧，使人發書至趙王，趙王悉召羣臣議，皆曰：『秦貪，負其彊，以空言求璧，償城恐不可得』。議不欲予秦璧。臣以為布衣之交尚不相欺，況大國乎！且以一璧之故逆彊秦之驩，不可。於是趙王乃齋戒五日，使臣奉璧，拜送書於庭。何者？嚴大國之威以修敬也。今臣至，大王見臣列觀，禮節甚倨；得璧，傳之美人，以戲弄臣。臣觀大王無意償趙王城邑，故臣復取璧。大王必欲急臣，臣頭今與璧俱碎於柱矣！」相如持其璧睨柱，欲以擊柱。秦王恐其破璧，乃辭謝固請，召有司案圖，指從此以往十五都予趙。

相如度秦王特以詐佯為予趙城，實不可得，乃謂秦王曰：「和氏璧，天下所共傳寶也。趙王恐，不敢不獻。趙王送璧時，齋戒五日，今大王亦宜齋戒五日，設九賓於廷，臣乃敢上璧。」秦王度之，終不可彊奪，遂許齋五日，舍相如廣成傳。相如度秦王雖齋，決負約不償城，乃使其從者衣褐，懷其璧，從徑道亡，歸璧於趙。

秦王齋五日後，乃設九賓禮於廷，引趙使者藺相如。相如至，謂秦王曰：「秦自繆公以來二十餘君，未嘗有堅明約束者也。臣誠恐見欺於王而負趙，故令人持璧歸，間至趙矣。且秦彊而趙弱，大王遣一介之使至趙，趙立奉璧來；今以秦之彊而先割十五都予趙，趙豈敢留璧而得罪於大王乎？臣知欺大王之罪當誅，臣請就湯鑊。唯大王與羣臣孰計議之！」秦王與羣臣相視而嘻。左右或欲引相如去，秦王因曰：「今殺相如，終不能得璧也，而絕秦趙之驩，不如因而厚遇之，使歸趙，趙王豈以一璧之故欺秦邪！」卒廷見相如，畢禮而歸之。相如既歸，趙王以為賢大夫，使不辱於諸侯，拜相如為上大夫。秦亦不以城予趙，趙亦終不予秦璧。

其後秦伐趙，拔石城。明年，復攻趙，殺二萬人。秦王使使者告趙王，欲與王為好會於西河外澠池。趙王畏秦，欲毋行。廉頗、藺相如計曰：「王不行，示趙弱且怯也。」趙王遂行，相如從。廉頗送至境，與王訣曰：「王行，度道里會遇之禮畢，還，不過三十日。三十日不還，則請立太子為王，以絕秦望。」王許之，遂與秦王會澠池。秦王飲酒酣，曰：「寡人竊聞趙王好音，請奏瑟。」趙王鼓瑟。秦御史前書曰：「某年月日，秦王與趙王會飲，令趙王鼓瑟。」藺相如前曰：「趙王竊聞秦王善為秦聲，請奏盆缻秦王，以相娛樂。」秦王怒，不許。於是相如前進缻，因跪請秦王。秦王不肯擊缻。相如曰：「五步之內，相如請得以頸血濺大王矣！」左右欲刃相如，相如張目叱之，左右皆靡。於是秦王不懌，為一擊缻。相如顧召趙御史書曰：「某年月日，秦王為趙王擊缻。」秦之羣臣曰：「請以趙十五城為秦王壽。」藺相如亦曰：「請以秦之咸陽為趙王壽。」秦王竟酒，終不能加勝於趙。趙亦盛設兵以待秦，秦不敢動。

既罷歸國，以相如功大，拜為上卿，位在廉頗之右。廉頗曰：「我為趙將，有攻城野戰之大功，而藺相如徒以口舌為勞，而位居我上，且相如素賤人，吾羞，不忍為之下。」宣言曰：「我見相如，必辱之。」相如聞，不肯與會。相如每朝時，常稱病，不欲與廉頗爭列。已而相如出，望見廉頗，相如引車避匿。於是舍人相與諫曰：「臣所以去親戚而事君者，徒慕君之高義也。今君與廉頗同列，廉君宣惡言而君畏匿之，恐懼殊甚，且庸人尚羞之，況於將相乎！臣等不肖，請辭去。」藺相如固止之，曰：「公之視廉將軍孰與秦王？」曰：「不若也。」相如曰：「夫以秦王之威，而相如廷叱之，辱其羣臣，相如雖駑，獨畏廉將軍哉？顧吾念之，彊秦之所以不敢加兵於趙者，徒以吾兩人在也。今兩虎共鬥，其勢不俱生。吾所以為此者，以先國家之急而後私讎也。」廉頗聞之，肉袒負荊，因賓客至藺相如門謝罪。曰：「鄙賤之人，不知將軍寬之至此也。」卒相與驩，為刎頸之交。

                    <h4 class="text-sm font-semibold text-deep-blue mt-4">譯文</h4>
                    <div class="mt-2 text-sm text-slate-700 leading-relaxed">
                        <p>廉颇是赵国的优秀将领。赵惠文王十六年，廉颇担任赵国大将去讨伐齐国，大败齐军，夺取了阳晋，被封为上卿，凭着勇气在诸侯国中闻名。蔺相如是赵国人，担任赵国宦官头目缪贤的门客。</p>
                        <p>赵惠文王在位时，得到了楚国的和氏璧。秦昭王听说这件事，派人送给赵王一封信，表示愿意用十五座城池来换取这块璧。赵王与大将军廉颇等群臣商议：想给秦国吧，担心秦国的城池根本得不到，白白被欺骗；想不给吧，又担心秦国的军队打过来。计策还没有定下来，想找一个可以派去回复秦国的人，也没有找到。宦者令缪贤说：“我的门客蔺相如可以派去。”赵王问：“你怎么知道他可以？”缪贤回答说：“我曾犯过罪，私下计划想逃亡到燕国去，我的门客相如阻止我，说：‘您怎么了解燕王呢？’我告诉他：‘我曾跟随大王与燕王在边境上会盟，燕王私下握着我的手说“愿意结为朋友”。我凭这一点了解他，所以想去。’相如对我说：‘赵国强大而燕国弱小，而您当时受到赵王的宠信，所以燕王想和您结交。如今您是从赵国逃亡到燕国，燕王害怕赵国，在那种势头下他一定不敢收留您，反而会把您绑了送回赵国。您不如脱掉上衣，露出肩膀，伏在刑具上请罪，这样或许侥幸能得到赦免。’我听从了他的计策，大王您也宽大赦免了我。我私下认为这个人是个勇士，又有智谋，应该可以派去。”</p>
                        <p>于是赵王召见蔺相如，问他：“秦王用十五座城池请求交换我的和氏璧，可以给他吗？”相如说：“秦国强大而赵国弱小，不能不答应。”赵王说：“拿走了我的璧，却不给我城池，怎么办？”相如说：“秦国用城池求取璧而赵国不答应，理亏在赵国；赵国给了璧而秦国不给赵国城池，理亏在秦国。衡量这两个对策，宁可答应给秦国，让秦国承担理亏的责任。”赵王问：“谁可以作为使者？”相如说：“大王如果实在没有合适的人，臣愿意捧着和氏璧出使秦国。城池划归赵国，璧就留在秦国；城池如果不给赵国，臣请求将完好无损的璧带回赵国。”赵王于是就派遣蔺相如奉着璧向西进入秦国。</p>
                        <p>秦王坐在章台宫接见蔺相如，相如捧着璧献给秦王。秦王大喜，把璧传给妃嫔美人们以及左右侍从观看，左右侍从都高呼万岁。相如看出秦王没有诚意把城池补偿给赵国，于是上前说：“这块璧上有点瑕疵，请让我指给大王看。”秦王把璧交给他，相如趁机一把夺过璧，退后几步站定，靠着柱子，愤怒得头发直竖把帽子都顶了起来，对秦王说：“大王想要得到这块璧，派人送来书信给赵王，赵王悉召群臣议，皆曰：‘秦贪，负其强，以空言求璧，偿城恐不可得’。议不欲予秦璧。臣以为布衣之交尚不相欺，况大国乎！且以一璧之故逆强秦之欢，不可。于是赵王乃斋戒五日，使臣奉璧，拜送书于庭。何者？严大国之威以修敬也。今臣至，大王见臣列观，礼节甚倨；得璧，传之美人，以戏弄臣。臣观大王无意偿赵王城邑，故臣复取璧。大王必欲急臣，臣头今与璧俱碎于柱矣！”</p>
                        <p>相如拿着那块璧斜眼看着柱子，作势要撞向柱子。秦王害怕他撞碎和氏璧，于是道歉并坚决请求他不要这么做，又召来主管官吏查看地图，指着说从这里到那里的十五座城邑给赵国。相如料定秦王只不过是欺诈、假装给赵国城池，实际上根本得不到，于是对秦王说：“和氏璧是天下公认的宝贝。赵王害怕，不敢不献。赵王送璧时，斋戒五日，今大王亦宜斋戒五日，设九宾于庭，臣乃敢上璧。”秦王估计一下，终究不能强行夺取，遂许斋五日，舍相如广成传。相如度秦王虽斋，决负约不偿城，乃使其从者衣褐，怀其璧，從徑道亡，归璧于赵。</p>
                        <p>秦王斋五日后，乃设九宾礼于庭，引赵使者蔺相如。相如至，谓秦王曰：“秦自缪公以来二十余君，未尝有坚明约束者也。臣诚恐见欺于王而负赵，故令人持璧归，间至赵矣。且秦强而赵弱，大王遣一介之使至赵，赵立奉璧来；今以秦之强而先割十五都予赵，赵岂敢留璧而得罪于大王乎？臣知欺大王之罪当诛，臣请就汤锅。唯大王与群臣孰计议之！”秦王与群臣面面相觑发出惊叹声。左右侍从有的想把相如拉下去处死，秦王因曰：“今杀相如，终不能得璧也，而绝秦赵之欢，不如因而厚遇之，使归赵，赵王岂以一璧之故欺秦邪！”卒廷见相如，毕礼而归之。相如既归，赵王以为贤大夫，使不辱于诸侯，拜相如为上大夫。秦亦不以城予赵，赵亦终不予秦璧。</p>
                        <p>其后秦伐赵，拔石城。明年，复攻赵，杀二万人。秦王使使者告赵王，欲与王为好会于西河外渑池。赵王畏秦，欲毋行。廉颇、蔺相如计曰：“王不行，示赵弱且怯也。”赵王遂行，相如从。廉颇送至境，与王诀曰：“王行，度道里会遇之礼毕，还，不过三十日。三十日不还，则请立太子为王，以绝秦望。”王许之，遂与秦王会渑池。秦王饮酒酣，曰：“寡人窃闻赵王好音，请奏瑟。”赵王鼓瑟。秦御史前书曰：“某年月日，秦王与赵王会饮，令赵王鼓瑟。”蔺相如前曰：“赵王窃闻秦王善为秦声，请奏盆缻秦王，以相娱乐。”秦王怒，不许。于是相如前进缻，因跪请秦王。秦王不肯击缻。相如曰：“五步之内，相如请得以颈血溅大王矣！”左右欲刃相如，相如张目叱之，左右皆靡。于是秦王不怿，为一击缻。相如顾召赵御史书曰：“某年月日，秦王为赵王击缻。”秦之群臣曰：“请以赵十五城为秦王寿。”蔺相如亦曰：“请以秦之咸阳为赵王寿。”秦王竟酒，终不能加胜于赵。赵亦盛设兵以待秦，秦不敢动。既罢归国，以相如功大，拜为上卿，位在廉颇之右。廉颇曰：“我为赵将，有攻城野战之大功，而蔺相如徒以口舌为劳，而位居我上，且相如素贱人，吾羞，不忍为之下。”宣言曰：“我见相如，必辱之。”相如闻，不肯与会。相如每朝时，常称病，不欲与廉颇争列。已而相如出，望见廉颇，相如引车避匿。于是舍人相与谏曰：“臣所以去亲戚而事君者，徒慕君之高义也。今君与廉颇同列，廉君宣恶言而君畏匿之，恐惧殊甚，且庸人尚羞之，况于将相乎！臣等不肖，请辞去。”蔺相如固止之，曰：“公之视廉将军孰与秦王？”曰：“不若也。”相如曰：“夫以秦王之威，而相如廷叱之，辱其群臣，相如雖驽，独畏廉将军哉？顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。今两虎共斗，其势不俱生。吾所以为此者，以先国家之急而后私仇也。”廉颇闻之，肉袒负荊，因宾客至蔺相如门谢罪。曰：“鄙贱之人，不知将校宽之至此也。”卒相与欢，为刎颈之交。</p>

        function setupScrollSpy() {
            if (scrollSpyObserver) scrollSpyObserver.disconnect();
            const options = { root: null, rootMargin: '-25% 0px -60% 0px', threshold: 0 };
            scrollSpyObserver = new IntersectionObserver((entries) => {
                if (isManualScrolling) return;
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const num = entry.target.id.split('-').pop();
                        highlightGuide(parseInt(num));
                    }
                });
            }, options);

            const sections = document.querySelectorAll('#questions-list [id^="q-box-"], #questions-list .question-card-block');
            sections.forEach(section => {
                if (section.id) {
                    scrollSpyObserver.observe(section);
                }
            });
        }

        function ensureQuestionSectionIds() {
            const questionBlocks = Array.from(document.querySelectorAll('#questions-list > .question-card-block, #questions-list .space-y-6 > div'));
            let idCounter = 1;
            questionBlocks.forEach((block) => {
                if (!block.querySelector('input[type="radio"], textarea')) return;
                if (!block.id?.startsWith('q-box-')) {
                    block.id = `q-box-${idCounter}`;
                }
                idCounter += 1;
            });
        }

        function renderBulbs(count) {
            const container = document.getElementById('bulb-container');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const bulb = document.createElement('div');
                bulb.id = `bulb-${i}`;
                bulb.className = 'w-8 h-8 rounded-full bg-soft-red text-white border border-transparent flex items-center justify-center text-xs font-bold cursor-pointer hover:scale-105 transition-all';
                bulb.title = `跳轉至第 ${i} 題`;
                bulb.textContent = `${i}`;
                bulb.addEventListener('click', () => scrollToQuestion(i));
                container.appendChild(bulb);
            }
            updateMCBulbs();
            if (count > 0) {
                highlightGuide(1);
            }
        }

        function handleInput(index, value) {
            const bulb = document.getElementById(`bulb-${index}`);
            highlightGuide(index);
            if (value.trim() === '') {
                bulb?.classList.remove('bg-calm-mint', 'text-white', 'border-transparent');
                bulb?.classList.add('bg-soft-red', 'text-white', 'border-transparent');
            } else {
                bulb?.classList.remove('bg-soft-red', 'text-white', 'border-transparent');
                bulb?.classList.add('bg-calm-mint', 'text-white', 'border-transparent');
            }
            updateOverallProgress();
        }

        function scrollToQuestion(index) {
            let target = document.getElementById(`q-box-${index}`);
            if (!target) {
                const sections = Array.from(document.querySelectorAll('#questions-list [id^="q-box-"], #questions-list .space-y-6 > div'));
                target = sections[index - 1];
            }
            if (!target) return;
            isManualScrolling = true;
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => {
                isManualScrolling = false;
            }, 600);
            highlightGuide(index);
        }

        function updateMCBulbs() {
            if (currentTotalQuestions === 0) return;
            for (let i = 1; i <= currentTotalQuestions; i++) {
                const bulb = document.getElementById(`bulb-${i}`);
                if (!bulb) continue;
                const answeredRadio = document.querySelector(`#questions-list input[name="q${i}"]:checked`);
                const textarea = document.querySelector(`#questions-list textarea#input-${i}`);
                const isCompleted = !!answeredRadio || (textarea && textarea.value.trim() !== '');
                if (isCompleted) {
                    bulb.classList.remove('bg-soft-red', 'border-transparent');
                    bulb.classList.add('bg-calm-mint', 'text-white', 'border-transparent');
                } else {
                    bulb.classList.remove('bg-calm-mint', 'text-white', 'border-transparent');
                    bulb.classList.add('bg-soft-red', 'text-white', 'border-transparent');
                }
            }
        }

        function updateOverallProgress() {
            if (currentTotalQuestions === 0) {
                document.getElementById('progress-text').textContent = '學習進度：0%';
                document.getElementById('progress-bar').style.width = '0%';
                return;
            }

            let answeredCount = 0;
            const textareas = document.querySelectorAll('#questions-list textarea');
            textareas.forEach(ta => {
                if (ta.value.trim() !== '') answeredCount++;
            });

            const radioNames = new Set();
            document.querySelectorAll('#questions-list input[type="radio"]').forEach((radio) => {
                radioNames.add(radio.name);
            });
            radioNames.forEach((name) => {
                if (document.querySelector(`#questions-list input[name="${name}"]:checked`)) {
                    answeredCount++;
                }
            });

            const percent = Math.round((answeredCount / currentTotalQuestions) * 100);
            document.getElementById('progress-text').textContent = `學習進度：${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            updateMCBulbs();
        }

        function closeMenu() {
            document.getElementById('subject-dropdown-menu').classList.add('hidden');
            document.getElementById('subject-dropdown-arrow').style.transform = 'rotate(0deg)';
        }

        document.getElementById('subject-dropdown-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const menu = document.getElementById('subject-dropdown-menu');
            const arrow = document.getElementById('subject-dropdown-arrow');
            const isHidden = menu.classList.toggle('hidden');
            arrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        document.addEventListener('click', closeMenu);

        // 啟動應用程式
        initApp();
    </script>
</body>
</html>
